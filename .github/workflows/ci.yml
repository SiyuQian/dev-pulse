name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - id: install
        run: npm ci

      # Each check is its own step so a red run names the thing that broke, and
      # each keeps going past an earlier failure — one push should surface every
      # problem rather than only the first.
      - name: Formatting (prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Lint (oxlint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Tests (vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      # Typecheck already ran, so this is the bundler only.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vite build
